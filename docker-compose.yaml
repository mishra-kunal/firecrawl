name: firecrawl
x-common-service:
  build: apps/api
  ulimits: &a1
    nofile:
      soft: 65535
      hard: 65535
  networks: &a2
    - backend
    - dokploy-network
  extra_hosts: &a3
    - host.docker.internal:host-gateway
x-common-env:
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://redis:6379}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  NUQ_DATABASE_URL: postgres://postgres:postgres@nuq-postgres:5432/postgres
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-true}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY}
  POSTHOG_HOST: ${POSTHOG_HOST}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kaWVsbW5iaXBwY3Jzc2dycHN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjMzNzIsImV4cCI6MjA3NDEzOTM3Mn0.JACSpO6P5jbPuk6uBmuYU6Dz5SHzGLM4jdxLj7Gr9X0}
  SUPABASE_URL: ${SUPABASE_URL:-https://odielmnbippcrssgrpsx.supabase.co}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kaWVsbW5iaXBwY3Jzc2dycHN4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1ODU2MzM3MiwiZXhwIjoyMDc0MTM5MzcyfQ.e24hIB6NdWMIF81UmKWEfhUuHQt5buVExZeSIn2T8hs}
  SUPABASE_REPLICA_URL: https://odielmnbippcrssgrpsx.supabase.co
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  SERPER_API_KEY: ${SERPER_API_KEY}
  SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER:-p.webshare.io}
  PROXY_USERNAME: ${PROXY_USERNAME:-zozjaaql-rotate}
  PROXY_PASSWORD: ${PROXY_PASSWORD:-3cuyzr4z0dtp}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
services:
  playwright-service:
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER:-p.webshare.io}
      PROXY_USERNAME: ${PROXY_USERNAME:-zozjaaql-rotate}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-3cuyzr4z0dtp}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-true}
    networks:
      - backend
  api:
    build: apps/api
    ulimits: *a1
    networks: *a2
    extra_hosts: *a3
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_RATE_LIMIT_URL: ${REDIS_URL:-redis://redis:6379}
      PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
      NUQ_DATABASE_URL: postgres://postgres:postgres@nuq-postgres:5432/postgres
      USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      BULL_AUTH_KEY: ${BULL_AUTH_KEY}
      TEST_API_KEY: ${TEST_API_KEY}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kaWVsbW5iaXBwY3Jzc2dycHN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjMzNzIsImV4cCI6MjA3NDEzOTM3Mn0.JACSpO6P5jbPuk6uBmuYU6Dz5SHzGLM4jdxLj7Gr9X0}
      SUPABASE_URL: ${SUPABASE_URL:-https://odielmnbippcrssgrpsx.supabase.co}
      SUPABASE_REPLICA_URL: https://odielmnbippcrssgrpsx.supabase.co
      SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kaWVsbW5iaXBwY3Jzc2dycHN4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1ODU2MzM3MiwiZXhwIjoyMDc0MTM5MzcyfQ.e24hIB6NdWMIF81UmKWEfhUuHQt5buVExZeSIn2T8hs}
      SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
      SERPER_API_KEY: ${SERPER_API_KEY}
      SEARCHAPI_API_KEY: ${SEARCHAPI_API_KEY}
      LOGGING_LEVEL: ${LOGGING_LEVEL}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
      HOST: 0.0.0.0
      PORT: ${INTERNAL_PORT:-3002}
      WORKER_PORT: ${WORKER_PORT:-3005}
      ENV: local
    depends_on:
      - redis
      - playwright-service
    ports:
      - ${PORT:-3002}:${INTERNAL_PORT:-3002}
    command: node dist/src/harness.js --start-docker
    labels:
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-web.rule=Host(`firecrawl.mrky.in`)
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-web.entrypoints=web
      - traefik.http.services.firstscoop-firecrawl-mobwep-1-web.loadbalancer.server.port=3002
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-web.service=firstscoop-firecrawl-mobwep-1-web
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-web.middlewares=redirect-to-https@file
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-websecure.rule=Host(`firecrawl.mrky.in`)
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-websecure.entrypoints=websecure
      - traefik.http.services.firstscoop-firecrawl-mobwep-1-websecure.loadbalancer.server.port=3002
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-websecure.service=firstscoop-firecrawl-mobwep-1-websecure
      - traefik.http.routers.firstscoop-firecrawl-mobwep-1-websecure.tls.certresolver=letsencrypt
      - traefik.swarm.network=dokploy-network
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.webcrawler-firecrawl-q2gwd7-6-web.rule=Host(`webcrawler-firecrawl-q2gwd7-f8800f-5-199-143-110.traefik.me`)
      - traefik.http.routers.webcrawler-firecrawl-q2gwd7-6-web.entrypoints=web
      - traefik.http.services.webcrawler-firecrawl-q2gwd7-6-web.loadbalancer.server.port=3002
      - traefik.http.routers.webcrawler-firecrawl-q2gwd7-6-web.service=webcrawler-firecrawl-q2gwd7-6-web
      - traefik.enable=true
  redis:
    image: redis:alpine
    networks:
      - backend
    command: redis-server --bind 0.0.0.0
  nuq-postgres:
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - backend
    ports:
      - 5432:5432
networks:
  backend:
    driver: bridge
  dokploy-network:
    external: true
